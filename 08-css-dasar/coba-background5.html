<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Coba background 5 - multiple background</title>
   <style>
      body {
         background-color: rgb(0, 6, 10);
         text-align: center;
         font-family: 'Courier New', Courier, monospace;
         color: #eee;
         font-size: 35px;
      }

      .frame {
         width: 500px;
         height: 500px;
         border: 3px solid #0022ff;
         margin: auto;

         background-image: url(img/profile.png), url(img/brush.png), url(img/wave.png);
         background-repeat: no-repeat, no-repeat;
         background-size: 180%, 100%, 100%;
         background-position: center bottom, center, bottom left;
         background-color: #eee;
         border-radius: 50%;
      }
   </style>
</head>

<body>
   <h1> adam daffa alghifari</h1>
   <div class="frame"> </div>
</body>

</html>
