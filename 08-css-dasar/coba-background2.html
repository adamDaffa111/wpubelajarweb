<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <style>
      body {
         height: 100vh;
         /* background-image 
         background: url(img/gmb1.jpg) no-repeat fixed; 
         background-size: cover;*/
         background-image: linear-gradient(to right, rgb(239, 128, 128), rgb(255, 197, 191));
      }

      .box1 {
         background-image: radial-gradient(rgb(239, 128, 128), rgb(255, 197, 191));
         width: 200px;
         height: 200px;
         margin-bottom: 10px;
      }

      .box2 {
         background-image: conic-gradient(rgb(239, 128, 128), rgb(255, 197, 191), rgb(244, 118, 104));
         width: 200px;
         height: 200px;
      }
   </style>
   <title>Coba background</title>
</head>

<body>
   <div class="box1"> radial gradient </div>
   <div class="box2"> conic gradient </div>
</body>

</html>
