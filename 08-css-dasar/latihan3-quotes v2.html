<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Quotes penyemangat</title>
   <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap');

      * {
         box-sizing: border-box;
      }

      body {
         font-family: "Cormorant", serif;
         background-image: linear-gradient(to bottom, rgba(11, 0, 35, 1), rgba(1, 37, 77, 0.6)), url(img/mountain.jpg);
         background-size: cover;
         background-position: center;
         background-repeat: no-repeat;
         text-align: center;
         margin: 0;
         padding-top: 100px;
         height: 100vh;
      }


      h1 {
         font-size: 43px;
         color: transparent;
         text-transform: uppercase;
         filter: drop-shadow(0 0 10px rgba(87, 199, 133, 1));
         background: linear-gradient(90deg, rgba(42, 123, 155, 1) 0%, rgba(87, 199, 133, 1) 50%, rgba(237, 221, 83, 1) 100%);
         background-clip: text;
      }

      .content {
         width: 70%;
         margin: 100px auto;
         border: 3px solid rgba(255, 213, 135, .1);
         border-radius: 15px;
         box-shadow: 0px 0px 20px rgba(37, 37, 37, 0.5);
         background-color: rgba(247, 247, 247, 0.107);
      }

      blockquote {
         font-size: 1.5em;
         color: #E6ECF5;
         font-style: italic;
      }

      p {
         color: rgb(255, 213, 135);
         font-size: 1.5em;
      }
   </style>
</head>

<body>
   <h1> quotes of the day</h1>
   <div class="content">
      <blockquote>
         "The best way to find yourself is to lose yourself in the service of others."
      </blockquote>
      <p> -- Mahatma Gandhi --</p>
   </div>
</body>

</html>
