<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <style>
      /*  
    simple selector
     
      h1 {
         font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
         font-size: 150px;
         text-align: center;
         color: lightblue
      } */

      /* pseoudo selector  
      ID*/
      #heading {
         font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
         font-size: 150px;
         text-align: center;
         color: rgb(218, 230, 173)
      }

      /* class */
      .center {
         text-align: center;
      }

      .lightred {
         color: lightcoral;
      }

</head>

<body>
   <h1 id="heading"> hello world</h1>

</html>
